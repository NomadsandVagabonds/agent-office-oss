<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#171b18;color:#eee8d6}body{font:14px/1.45 'IBM Plex Sans',sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{flex:none;display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center;padding:18px 24px 14px;border-bottom:1px solid #485345;background:#19231e}
h1{margin:0;font:400 25px/1.05 'Pixelify Sans';letter-spacing:.02em}header small{display:block;margin-top:5px;font:10px 'IBM Plex Mono';color:#a9b6a8;text-transform:uppercase;letter-spacing:.1em}
nav{display:flex;justify-content:center;gap:6px}button{font:inherit;cursor:pointer;color:inherit;background:transparent;border:1px solid #556053;padding:9px 14px;min-height:40px}button:focus-visible,a:focus-visible{outline:2px solid #eed18b;outline-offset:3px}nav button{font:400 18px 'Pixelify Sans';border:0;text-align:left;min-width:136px;padding:7px 12px}nav button span{font:10px 'IBM Plex Mono';display:block;color:#a7b0a0}nav button[aria-pressed=true]{background:#d1ae61;color:#201f13}nav button[aria-pressed=true] span{color:#51421f}button:hover{background:#354438}nav button[aria-pressed=true]:hover{background:#dfbd72}
.tools{display:flex;gap:4px}.tools button{font:12px 'IBM Plex Sans';padding:8px 11px}.tools button[aria-pressed=true]{border-bottom:3px solid #d1ae61;background:#2d3c31}
.summary{flex:none;display:flex;justify-content:space-between;gap:24px;padding:10px 24px;border-bottom:1px solid #354035;background:#202821}.summary p{margin:0;color:#c3cdbb;font-size:12px}.summary a{font:11px 'IBM Plex Mono';color:#dbc285;text-underline-offset:3px;white-space:nowrap}.summary strong{color:#eee8d6;font-weight:400}
main{position:relative;min-height:0;flex:1;background:#080c0a}iframe{display:block;width:100%;height:100%;border:0}.loading{position:absolute;inset:0;display:grid;place-items:center;font:22px 'Pixelify Sans';color:#c8b77f;background:#18211a;z-index:2}.loading[hidden]{display:none}.footnote{position:absolute;bottom:8px;right:12px;pointer-events:none;color:#999c8c;font:9px 'IBM Plex Mono';opacity:.8}
@media(max-width:950px){header{grid-template-columns:1fr auto;gap:12px;padding:12px 14px}nav{grid-column:1/-1;grid-row:2;justify-content:flex-start}nav button{flex:1;min-width:0;font-size:16px}.summary{padding:8px 14px}.summary a{display:none}}
@media(max-width:480px){header{gap:10px}h1{font-size:21px}header small{font-size:8px}.tools button{font-size:10px;padding:7px 8px;min-height:32px}nav{gap:2px}nav button{padding:6px 5px;font-size:14px}nav button span{font-size:8px}.summary p{font-size:11px}.footnote{display:none}}
