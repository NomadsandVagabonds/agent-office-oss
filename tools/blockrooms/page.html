<!--OG-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23d6c56c'/%3E%3Crect y='13' width='16' height='3' fill='%236f6a50'/%3E%3Crect y='12' width='16' height='1' fill='%235b4127'/%3E%3Crect x='5' y='4' width='6' height='9' fill='%232f2413'/%3E%3Crect x='6' y='5' width='4' height='8' fill='%230a0a08'/%3E%3Crect x='2' y='1' width='5' height='1' fill='%23fffbe0'/%3E%3Crect x='9' y='1' width='5' height='1' fill='%23fffbe0'/%3E%3C/svg%3E">
<!-- The import map comes before the preload links, on purpose: a browser that already has a preloaded module in its
     cache reads that module's imports at once, and if the map has not been read by then "three" cannot be resolved and
     the page never starts (seen on repeat visits: three loads in ten). -->
<script type="importmap"><!--IMPORTMAP--></script>
<!--PRELOAD-->
<style>
/* One screen, nothing on it but the level. No card, no instructions: you are simply there. A tape is dark. */
:root { color-scheme: dark; --tape: #0a0a08; --osd: #f1ead8; --rec: #ff3a26; }
html, body { height: 100%; margin: 0; }
body { background: var(--tape); color: var(--osd); font: 400 14px/1.4 ui-monospace, Menlo, Consolas, monospace; overflow: hidden;
  overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#stage, #ui { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#ui { pointer-events: none; z-index: 2; }
[hidden] { display: none !important; }
/* only ever seen if the tape cannot be read at all */
#fault, noscript p { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 9;
  margin: 0; color: var(--rec); letter-spacing: .06em; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui"></div>
<p id="fault" role="alert" hidden></p>
<noscript><p>NO SIGNAL — BlockRooms needs JavaScript. <a href="./">The front page</a> does not.</p></noscript>
<script type="module" src="./site.js"></script>
</body>
</html>
